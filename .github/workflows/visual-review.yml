name: DPN Settlement Real Render Visual Review

on:
  pull_request:
    branches: [main]
    paths: ["src/**", "assets/**", "simulation/**", "tools/capture_reference_views.gd", "tools/visual_fidelity_report.py", "tools/install_reference_models.py", ".github/workflows/visual-review.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settlement-visual-${{ github.ref }}
  cancel-in-progress: true

jobs:
  visual-evidence:
    name: Real Godot 3D Frame Capture
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install checksum-verified Godot
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/4.3-stable"
          NAME="Godot_v4.3-stable_linux.x86_64.zip"
          curl --proto '=https' --tlsv1.2 -fsSL "${BASE}/${NAME}" -o godot.zip
          curl --proto '=https' --tlsv1.2 -fsSL "${BASE}/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          EXPECTED="$(grep "  ${NAME}$" SHA512-SUMS.txt | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$(sha512sum godot.zip | awk '{print $1}')" = "$EXPECTED"
          mkdir -p .godot-visual
          unzip -q godot.zip -d .godot-visual
          chmod +x .godot-visual/Godot_v4.3-stable_linux.x86_64

      - name: Import authored CC0 meshes and materials
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/install_cc0_assets.py
          python3 tools/install_cc0_materials.py
          python3 tools/install_reference_models.py
          ".godot-visual/Godot_v4.3-stable_linux.x86_64" --headless --path . --import

      - name: Render the real game with software OpenGL
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v xvfb-run >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y xvfb libgl1-mesa-dri
          fi
          mkdir -p dist/visual
          GODOT=".godot-visual/Godot_v4.3-stable_linux.x86_64"
          set +e
          timeout 240s xvfb-run -a -s "-screen 0 1600x900x24" env LIBGL_ALWAYS_SOFTWARE=1 \
            "$GODOT" --path . --rendering-method gl_compatibility --resolution 1600x900 \
            --script res://tools/capture_reference_views.gd 2>&1 | tee dist/visual/render.log
          EXIT="${PIPESTATUS[0]}"
          set -e
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Parser Error|VISUAL QA: (empty|cannot|no|missing)' dist/visual/render.log; then
            echo "::error::Real Godot render reported an error"
            exit 1
          fi
          test "$EXIT" -eq 0
          for kind in 01_Overview 02_housing 02_command 02_medical; do
            test -s "dist/visual/${kind}_HUD.png"
            test -s "dist/visual/${kind}_WORLD.png"
          done

      - name: Quantify visible reference gap
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/visual_fidelity_report.py | tee dist/visual/quality-report.log
          {
            echo '### The Last Settlement: Actual Godot Reference Comparison'
            echo 'Frames are from the running game, NOT an image generator.'
            echo 'User HUD unchanged. Detail scores alone cannot approve art parity.'
            echo "Commit: $GITHUB_SHA"
            cat dist/visual/quality-report.log
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload rendered visual evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: LastSettlement-Real-Rendered-Visual-Evidence
          path: dist/visual/
          if-no-files-found: warn
          retention-days: 30
          compression-level: 0
