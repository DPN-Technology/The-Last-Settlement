name: DPN Settlement CI Gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settlement-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integrity:
    name: Source Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Validate repository structure
        run: python tools/validate_project.py
      - name: Validate release manifest generator
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .manifest-test
          printf 'portable-test\n' > .manifest-test/TheLastSettlement-Windows-x86_64.zip
          printf 'installer-test\n' > .manifest-test/TheLastSettlement-Setup-x64.msi
          python tools/release_manifest.py             --version 0.0.0-test             --channel development             --commit "$GITHUB_SHA"             --portable .manifest-test/TheLastSettlement-Windows-x86_64.zip             --installer .manifest-test/TheLastSettlement-Setup-x64.msi             --output .manifest-test/windows-release.json             --repository "$GITHUB_REPOSITORY"             --signing-status unsigned             --save-schema 14
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path(".manifest-test")
          data = json.loads((root / "windows-release.json").read_text(encoding="utf-8"))
          assert data["schema_version"] == 1
          assert data["version"] == "0.0.0-test"
          assert data["channel"] == "development"
          assert data["save_schema"] == 14
          for key in ("portable", "installer"):
              asset = data["assets"][key]
              path = root / asset["filename"]
              actual = hashlib.sha256(path.read_bytes()).hexdigest()
              assert actual == asset["sha256"]
              assert asset["size_bytes"] == path.stat().st_size
          print("Release manifest self-test passed.")
          PY
      - name: Security and workflow integrity audit
        run: python tools/security_audit.py
      - name: Conflict marker guard
        shell: bash
        run: |
          set -euo pipefail
          if grep -RInE '^(<<<<<<<|=======|>>>>>>>)' --exclude-dir=.git .; then
            echo "::error::Merge conflict markers detected."
            exit 1
          fi
      - name: GDScript hygiene checks
        shell: bash
        run: |
          set -euo pipefail
          test -s project.godot
          test -s src/Main.tscn
          test -s src/main.gd
          find src simulation -type f -name '*.gd' -print0 | while IFS= read -r -d '' file; do
            grep -q '^extends ' "$file" || { echo "::error::$file has no extends declaration"; exit 1; }
          done

      - name: Install pinned Godot 4.3 engine
        shell: bash
        run: |
          set -euo pipefail
          GODOT_ASSET="Godot_v4.3-stable_linux.x86_64.zip"
          GODOT_BASE="https://github.com/godotengine/godot-builds/releases/download/4.3-stable"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             "$GODOT_BASE/$GODOT_ASSET" -o godot.zip
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             "$GODOT_BASE/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          EXPECTED="$(grep "  $GODOT_ASSET$" SHA512-SUMS.txt | awk '{print $1}')"
          test -n "$EXPECTED"
          ACTUAL="$(sha512sum godot.zip | awk '{print $1}')"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p .godot-ci
          unzip -q godot.zip -d .godot-ci
          chmod +x ".godot-ci/Godot_v4.3-stable_linux.x86_64"
          ".godot-ci/Godot_v4.3-stable_linux.x86_64" --version

      - name: Install and import pinned CC0 3D survivor for smoke test
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/install_cc0_assets.py
          python3 tools/install_cc0_materials.py
          GODOT=".godot-ci/Godot_v4.3-stable_linux.x86_64"
          "$GODOT" --headless --path . --import
          test -s assets/3d/characters/survivor.glb

      - name: Godot project parse gate
        shell: bash
        run: |
          set -euo pipefail
          GODOT=".godot-ci/Godot_v4.3-stable_linux.x86_64"
          set +e
          "$GODOT" --headless --path . --editor --quit-after 2 2>&1 | tee godot-parse.log
          GODOT_EXIT="${PIPESTATUS[0]}"
          set -e
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Parser Error' godot-parse.log; then
            echo "::error::Godot reported a GDScript parse/load failure."
            exit 1
          fi
          test "$GODOT_EXIT" -eq 0

      - name: Boot the playable game and verify core controls
        shell: bash
        run: |
          set -euo pipefail
          GODOT=".godot-ci/Godot_v4.3-stable_linux.x86_64"
          set +e
          "$GODOT" --headless --path . --script res://tools/smoke_game.gd 2>&1 | tee smoke-game.log
          GODOT_EXIT="${PIPESTATUS[0]}"
          set -e
          if grep -Eiq 'SCRIPT ERROR|Parse Error|Failed to load script|Parser Error|SMOKE:' smoke-game.log; then
            echo "::error::The playable game smoke check reported an error."
            exit 1
          fi
          grep -q 'PLAYTEST SMOKE PASS' smoke-game.log
          test "$GODOT_EXIT" -eq 0

  policy:
    name: Security Policy Surface
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Verify governance files
        shell: bash
        run: |
          set -euo pipefail
          test -s SECURITY.md
          test -s CONTRIBUTING.md
          test -s .github/CODEOWNERS
          test -s .github/dependabot.yml
          test -s docs/SECURITY_GATES.md

  green-gate:
    name: Settlement Green Gate
    if: always()
    needs: [integrity, policy]
    runs-on: ubuntu-latest
    steps:
      - name: Evaluate required jobs
        env:
          INTEGRITY: ${{ needs.integrity.result }}
          POLICY: ${{ needs.policy.result }}
        run: |
          echo "Source Integrity: $INTEGRITY"
          echo "Security Policy Surface: $POLICY"
          test "$INTEGRITY" = "success"
          test "$POLICY" = "success"
          echo "DPN THE LAST SETTLEMENT: GREEN"
