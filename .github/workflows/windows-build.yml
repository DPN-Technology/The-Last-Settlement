name: DPN Settlement Windows Build

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "project.godot"
      - "export_presets.cfg"
      - "src/**"
      - "simulation/**"
      - "assets/**"
      - ".github/workflows/windows-build.yml"
      - "packaging/windows/**"
      - "tools/release_manifest.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: settlement-windows-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

env:
  GODOT_VERSION: "4.3-stable"
  GODOT_TEMPLATE_VERSION: "4.3.stable"
  GODOT_ASSET: "Godot_v4.3-stable_linux.x86_64.zip"
  GODOT_TEMPLATES: "Godot_v4.3-stable_export_templates.tpz"
  PACKAGE_VERSION: "1.0.5"
  DISPLAY_VERSION: "1.0.5"

jobs:
  build-windows:
    name: Windows x86_64 Portable Build
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Restore Godot Windows export templates
        id: export-templates
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.local/share/godot/export_templates/4.3.stable
          key: godot-4.3-stable-windows-x86_64-export-templates-v1

      - name: Install checksum-verified Godot 4.3 editor
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             "${BASE}/${GODOT_ASSET}" -o godot.zip
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             "${BASE}/SHA512-SUMS.txt" -o SHA512-SUMS.txt
          EXPECTED="$(grep "  ${GODOT_ASSET}$" SHA512-SUMS.txt | awk '{print $1}')"
          ACTUAL="$(sha512sum godot.zip | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          mkdir -p .godot-build
          unzip -q godot.zip -d .godot-build
          chmod +x ".godot-build/Godot_v4.3-stable_linux.x86_64"
          ".godot-build/Godot_v4.3-stable_linux.x86_64" --version

      - name: Install checksum-verified Windows export templates
        if: steps.export-templates.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://github.com/godotengine/godot-builds/releases/download/${GODOT_VERSION}"
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             "${BASE}/${GODOT_TEMPLATES}" -o export_templates.tpz
          curl --proto '=https' --tlsv1.2 --fail --location --silent --show-error             "${BASE}/SHA512-SUMS.txt" -o TEMPLATE-SHA512-SUMS.txt
          EXPECTED="$(grep "  ${GODOT_TEMPLATES}$" TEMPLATE-SHA512-SUMS.txt | awk '{print $1}')"
          ACTUAL="$(sha512sum export_templates.tpz | awk '{print $1}')"
          test -n "$EXPECTED"
          test "$ACTUAL" = "$EXPECTED"
          TEMPLATE_DIR="$HOME/.local/share/godot/export_templates/${GODOT_TEMPLATE_VERSION}"
          mkdir -p "$TEMPLATE_DIR"
          unzip -j -q export_templates.tpz             "templates/windows_release_x86_64.exe"             "templates/windows_debug_x86_64.exe"             -d "$TEMPLATE_DIR"
          test -s "$TEMPLATE_DIR/windows_release_x86_64.exe"
          test -s "$TEMPLATE_DIR/windows_debug_x86_64.exe"

      - name: Verify project parses before export
        shell: bash
        run: |
          set -euo pipefail
          GODOT=".godot-build/Godot_v4.3-stable_linux.x86_64"
          "$GODOT" --headless --path . --editor --quit-after 2

      - name: Export Windows release
        shell: bash
        run: |
          set -euo pipefail
          GODOT=".godot-build/Godot_v4.3-stable_linux.x86_64"
          mkdir -p dist/windows
          "$GODOT" --headless --path . --export-release "Windows Desktop" "dist/windows/TheLastSettlement.exe"
          test -s dist/windows/TheLastSettlement.exe
          test -s dist/windows/TheLastSettlement.pck

      - name: Verify Windows package
        shell: bash
        run: |
          set -euo pipefail
          file dist/windows/TheLastSettlement.exe | tee dist/windows/EXECUTABLE-TYPE.txt
          grep -Eq 'PE32|MS Windows' dist/windows/EXECUTABLE-TYPE.txt
          (
            cd dist/windows
            sha256sum TheLastSettlement.exe TheLastSettlement.pck > SHA256SUMS.txt
            sha256sum -c SHA256SUMS.txt
          )

      - name: Add portable run instructions
        shell: bash
        run: |
          cat > dist/windows/README-WINDOWS.txt <<'EOF'
          THE LAST SETTLEMENT // WINDOWS PORTABLE BUILD
          DPN TECHNOLOGY

          1. Extract the complete ZIP to a normal folder.
          2. Keep TheLastSettlement.exe and TheLastSettlement.pck together.
          3. Double-click TheLastSettlement.exe.

          This stable build is currently unsigned. Windows SmartScreen may
          show an "Unknown publisher" warning until DPN Technology adds a Windows
          code-signing certificate to the release pipeline.

          Do not delete or rename TheLastSettlement.pck. The executable loads
          the game data from that file.

          DEVELOP. PIONEER. NAVIGATE.
          THE OLD WORLD DIED. BUILD THE NEXT ONE.
          EOF

      - name: Create portable ZIP
        shell: bash
        run: |
          set -euo pipefail
          cd dist/windows
          zip -9 "../TheLastSettlement-Windows-x86_64.zip"             TheLastSettlement.exe             TheLastSettlement.pck             README-WINDOWS.txt             SHA256SUMS.txt
          cd ../..
          test -s dist/TheLastSettlement-Windows-x86_64.zip

      - name: Upload Windows portable build
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TheLastSettlement-Windows-x86_64
          path: dist/TheLastSettlement-Windows-x86_64.zip
          if-no-files-found: error
          retention-days: 30
          compression-level: 0


  package-windows:
    name: Windows Installer + Final Portable Package
    needs: build-windows
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      WINDOWS_SIGN_CERT_BASE64: ${{ secrets.WINDOWS_SIGN_CERT_BASE64 }}
      WINDOWS_SIGN_CERT_PASSWORD: ${{ secrets.WINDOWS_SIGN_CERT_PASSWORD }}

    steps:
      - name: Checkout packaging sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Download verified portable payload
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TheLastSettlement-Windows-x86_64
          path: incoming

      - name: Extract and verify payload
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          Expand-Archive -Path "incoming\TheLastSettlement-Windows-x86_64.zip" -DestinationPath "payload" -Force
          Get-Content "payload\SHA256SUMS.txt" | ForEach-Object {
            $parts = $_ -split "\s+", 2
            $expected = $parts[0].ToLowerInvariant()
            $file = Join-Path "payload" $parts[1]
            $actual = (Get-FileHash $file -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actual -ne $expected) { throw "Checksum mismatch: $file" }
          }
          Get-Item "payload\TheLastSettlement.exe" | Format-List FullName,Length

      - name: Sign game executable when DPN certificate is configured
        if: env.WINDOWS_SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "dpn-windows-signing.pfx"
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $signtool) { throw "signtool.exe not found" }
          & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGN_CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 "payload\TheLastSettlement.exe"
          & $signtool verify /pa /v "payload\TheLastSettlement.exe"
          Remove-Item $pfx -Force

      - name: Rebuild final portable ZIP
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $exeHash = (Get-FileHash "payload\TheLastSettlement.exe" -Algorithm SHA256).Hash.ToLowerInvariant()
          $pckHash = (Get-FileHash "payload\TheLastSettlement.pck" -Algorithm SHA256).Hash.ToLowerInvariant()
          @(
            "$exeHash  TheLastSettlement.exe"
            "$pckHash  TheLastSettlement.pck"
          ) | Set-Content "payload\SHA256SUMS.txt" -Encoding ascii
          New-Item -ItemType Directory -Force -Path "dist" | Out-Null
          Compress-Archive -Path "payload\TheLastSettlement.exe","payload\TheLastSettlement.pck","payload\README-WINDOWS.txt","payload\SHA256SUMS.txt" -DestinationPath "dist\TheLastSettlement-Windows-x86_64.zip" -CompressionLevel Optimal -Force

      - name: Build per-user MSI installer
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          New-Item -ItemType Directory -Force -Path "installer" | Out-Null
          $candle = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin\candle.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          $light = Get-ChildItem "${env:ProgramFiles(x86)}\WiX Toolset v3.*\bin\light.exe" -ErrorAction SilentlyContinue |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          if (-not $candle -or -not $light) { throw "WiX Toolset v3 was not found on windows-latest." }
          $payload = (Resolve-Path "payload").Path
          & $candle "-dPayloadDir=$payload" "-dProductVersion=$env:PACKAGE_VERSION" "packaging\windows\TheLastSettlement.wxs" -out "installer\TheLastSettlement.wixobj"
          if ($LASTEXITCODE -ne 0) { throw "WiX candle failed" }
          & $light "installer\TheLastSettlement.wixobj" -out "dist\TheLastSettlement-Setup-x64.msi"
          if ($LASTEXITCODE -ne 0) { throw "WiX light failed" }
          if (-not (Test-Path "dist\TheLastSettlement-Setup-x64.msi")) { throw "MSI was not produced" }

      - name: Sign installer when DPN certificate is configured
        if: env.WINDOWS_SIGN_CERT_BASE64 != ''
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $pfx = Join-Path $env:RUNNER_TEMP "dpn-windows-signing.pfx"
          [IO.File]::WriteAllBytes($pfx,[Convert]::FromBase64String($env:WINDOWS_SIGN_CERT_BASE64))
          $signtool = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\signtool.exe" |
            Sort-Object FullName -Descending | Select-Object -First 1 -ExpandProperty FullName
          & $signtool sign /fd SHA256 /f $pfx /p $env:WINDOWS_SIGN_CERT_PASSWORD /tr "http://timestamp.digicert.com" /td SHA256 "dist\TheLastSettlement-Setup-x64.msi"
          & $signtool verify /pa /v "dist\TheLastSettlement-Setup-x64.msi"
          Remove-Item $pfx -Force

      - name: Write and verify distribution checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $portable = (Get-FileHash "dist\TheLastSettlement-Windows-x86_64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $installer = (Get-FileHash "dist\TheLastSettlement-Setup-x64.msi" -Algorithm SHA256).Hash.ToLowerInvariant()

          "$portable  TheLastSettlement-Windows-x86_64.zip" |
            Set-Content "dist\SHA256SUM-PORTABLE.txt" -Encoding ascii
          "$installer  TheLastSettlement-Setup-x64.msi" |
            Set-Content "dist\SHA256SUM-INSTALLER.txt" -Encoding ascii
          @(
            "$portable  TheLastSettlement-Windows-x86_64.zip"
            "$installer  TheLastSettlement-Setup-x64.msi"
          ) | Set-Content "dist\SHA256SUMS-WINDOWS.txt" -Encoding ascii

          $portableCheck = (Get-FileHash "dist\TheLastSettlement-Windows-x86_64.zip" -Algorithm SHA256).Hash.ToLowerInvariant()
          $installerCheck = (Get-FileHash "dist\TheLastSettlement-Setup-x64.msi" -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($portableCheck -ne $portable) { throw "Portable ZIP checksum verification failed." }
          if ($installerCheck -ne $installer) { throw "MSI checksum verification failed." }

      - name: Build machine-readable Windows update manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $channel = "development"
          $manifestVersion = $env:DISPLAY_VERSION
          $tagArgs = @()
          if ($env:GITHUB_REF -like "refs/tags/v*") {
            $tag = $env:GITHUB_REF_NAME
            $channel = if ($tag -match "-") { "prerelease" } else { "stable" }
            $manifestVersion = $tag.TrimStart("v")
            $tagArgs = @("--release-tag", $tag)
          }
          $signing = if ([string]::IsNullOrWhiteSpace($env:WINDOWS_SIGN_CERT_BASE64)) { "unsigned" } else { "signed" }

          $args = @(
            "tools/release_manifest.py",
            "--version", $manifestVersion,
            "--channel", $channel,
            "--commit", $env:GITHUB_SHA,
            "--portable", "dist\TheLastSettlement-Windows-x86_64.zip",
            "--installer", "dist\TheLastSettlement-Setup-x64.msi",
            "--output", "dist\windows-release.json",
            "--repository", $env:GITHUB_REPOSITORY,
            "--signing-status", $signing,
            "--save-schema", "14"
          ) + $tagArgs

          python @args
          if ($LASTEXITCODE -ne 0) { throw "Release manifest generator failed." }
          python -m json.tool "dist\windows-release.json" | Out-Null

      - name: Upload final portable Windows package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TheLastSettlement-Windows-Portable-Final
          path: |
            dist/TheLastSettlement-Windows-x86_64.zip
            dist/SHA256SUM-PORTABLE.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows MSI installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TheLastSettlement-Windows-Installer
          path: |
            dist/TheLastSettlement-Setup-x64.msi
            dist/SHA256SUM-INSTALLER.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload Windows update metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TheLastSettlement-Windows-Update-Metadata
          path: |
            dist/windows-release.json
            dist/SHA256SUMS-WINDOWS.txt
          if-no-files-found: error
          retention-days: 30


  publish-release:
    name: Publish Tagged Windows Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package-windows
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Download final portable package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TheLastSettlement-Windows-Portable-Final
          path: release

      - name: Download MSI installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TheLastSettlement-Windows-Installer
          path: release

      - name: Download update metadata
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: TheLastSettlement-Windows-Update-Metadata
          path: release

      - name: Verify tagged release payload
        shell: bash
        run: |
          set -euo pipefail
          cd release
          sha256sum -c SHA256SUMS-WINDOWS.txt
          python -m json.tool windows-release.json >/dev/null
          test -s TheLastSettlement-Windows-x86_64.zip
          test -s TheLastSettlement-Setup-x64.msi

      - name: Publish or update GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail

          assets=(
            "release/TheLastSettlement-Windows-x86_64.zip"
            "release/TheLastSettlement-Setup-x64.msi"
            "release/SHA256SUMS-WINDOWS.txt"
            "release/windows-release.json"
          )

          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "${assets[@]}" --clobber
            exit 0
          fi

          release_flags=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then
            release_flags+=(--prerelease)
          fi

          gh release create "$GITHUB_REF_NAME"             "${assets[@]}"             --verify-tag             --generate-notes             --title "The Last Settlement $GITHUB_REF_NAME"             "${release_flags[@]}"
