version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "security"
    # Keep CodeQL init, analyze and SARIF uploader on the same version.
    groups:
      codeql-actions:
        patterns:
          - "github/codeql-action/*"
